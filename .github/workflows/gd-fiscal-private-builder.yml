name: GD Fiscal Private Builder

on:
  push:
    branches: ["gd-fiscal-private-builder"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GD_FISCAL_EXPECTED_SHA: 43c0cb53e976b1b791f2ea94b31c969db14eac93

jobs:
  probe-private-source:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout private GD Fiscal source
        uses: actions/checkout@v4
        with:
          repository: AdvGabrielDeble/gd-solucoes-fiscal-saude
          ref: fix/multi-professional-import-filter
          path: src
          token: ${{ github.token }}
      - name: Verify exact source SHA
        shell: pwsh
        run: |
          Set-Location src
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne $env:GD_FISCAL_EXPECTED_SHA) { throw "Unexpected source SHA: $sha" }
          Write-Host "private-source-checkout:ok"
